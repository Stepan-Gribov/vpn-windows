name: Build Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Stepan-Gribov/vpn-windows' && github.actor == 'Stepan-Gribov'
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build the public ZIP
        run: .\Build-Windows.ps1 -RestoreDependencies
      - name: Test subscription handling and transports
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: go -C native/CombinedXray test -mod=readonly -count=1 -timeout=90s ./internal/desktop . github.com/cacggghp/vk-turn-proxy/pkg/clientcore
      - name: Check packaged version and launch the Windows UI
        run: |
          $build = Get-Content dist\last-build.json -Raw | ConvertFrom-Json
          if ($build.sourceDirty -or $build.distribution -cne 'public' -or $build.sourceCommit -cne $env:GITHUB_SHA) {
              throw 'The package must come from the clean workflow revision.'
          }
          $app = $build.artifact -replace '\.zip$', ''
          $engine = Join-Path $app 'TnDtun.Engine.exe'
          if ((& $engine --version) -cne $build.version) { throw 'Unexpected engine version.' }
          $qa = Join-Path $env:RUNNER_TEMP 'tndtun-ui'
          New-Item -ItemType Directory -Path $qa | Out-Null
          $smoke = Start-Process (Join-Path $app 'TnDtun.exe') -ArgumentList ('--smoke "' + $qa + '"') -PassThru
          if (!$smoke.WaitForExit(30000)) { $smoke.Kill(); throw 'UI smoke timed out.' }
          if ($smoke.ExitCode -or !(Test-Path (Join-Path $qa 'TnDtun-main.png'))) { throw 'UI smoke failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tndtun-windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/TnDtun-*-windows-x64.zip
            dist/TnDtun-*-windows-x64.zip.sha256
